- name: "List files"
  run: "ls"

- name: "Create folder"
  run:
    - "sleep 5"
    - "mkdir -p release/build"

- name: "Set up environment"
  run:
    - "export NODE_ENV=production"
    - "echo Environment set to $NODE_ENV"

- name: "Build from yml"
  run:
    - "echo Environment: $NODE_ENV"
    - "CAP=2"
    - "echo Building with CAP=$CAP"
    - "ls"
    - "touch build.txt"
    - "echo 'Build complete' > build.txt"

- name: "Making step things"
  run:
    - "for i in {1,2}{A,B}; do echo \"$i\"; sleep $((RANDOM%5+1)); done"

- name: "Example multiline script"
  run: |
    echo "Inicio"
    export NODE_ENV=production
    echo "Environment: $NODE_ENV"
    mkdir -p release/build
    echo "Fin"
