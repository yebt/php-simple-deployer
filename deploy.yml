- name: "Always runs"
  run: "echo '[always] no when condition — always executes'"

- name: "Only for frontend repo"
  when: '[ "$DEPLOY_REPO" = "frontend" ]'
  run: "echo '[frontend] deploying frontend app'"

- name: "Only for backend repo"
  when: '[ "$DEPLOY_REPO" = "backend" ]'
  run: "echo '[backend] deploying backend app'"

- name: "Frontend + main branch only"
  when: '[ "$DEPLOY_REPO" = "frontend" ] && [ "$DEPLOY_BRANCH" = "main" ]'
  run: "echo '[frontend+main] production build triggered'"

- name: "Frontend + staging branch"
  when: '[ "$DEPLOY_REPO" = "frontend" ] && [ "$DEPLOY_BRANCH" = "staging" ]'
  run: "echo '[frontend+staging] staging build triggered'"

- name: "Any repo on main branch"
  when: '[ "$DEPLOY_BRANCH" = "main" ]'
  run: "echo '[main] branch is main — running post-deploy tasks'"

- name: "Env var not set (no context sent)"
  when: '[ -z "$DEPLOY_REPO" ]'
  run: "echo '[no-context] DEPLOY_REPO was not provided in the webhook'"

- name: "List files (always)"
  run: "ls"
